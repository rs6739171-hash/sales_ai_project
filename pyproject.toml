[project]
name = "sales-ai-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rs6739171-hash", email = "rs6739171@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-ollama>=1.1.0,<2",
    "langchain-core>=1.6.13,<2",
    "ollama>=0.6.3,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.7,<3",
    "openai>=1.0",
    "cmdstanpy>=1.3.0",
    "databricks-sdk>=0.154.0",
    "databricks-sql-connector>=4.7.0",
    "fastapi>=0.156.4",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "prophet>=1.5.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "tensorflow>=2.21.0",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
    "boto3>=1.43.118",
]

[project.scripts]
sales-ai-project = "sales_ai_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
extraPaths = [
    "backend/src",
    "backend/src/data",
    "backend",
]


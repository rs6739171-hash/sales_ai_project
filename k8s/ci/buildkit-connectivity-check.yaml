apiVersion: v1
kind: Pod
metadata:
  name: buildkit-connectivity-check
  namespace: jenkins-agents
spec:
  restartPolicy: Never
  serviceAccountName: jenkins-agent
  automountServiceAccountToken: false

  nodeSelector:
    salesiq.io/node-pool: applications

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: buildctl
      image: moby/buildkit:v0.34.1
      imagePullPolicy: IfNotPresent
      command: ["buildctl"]
      args:
        - --addr=tcp://buildkitd.jenkins-agents.svc.cluster.local:1234
        - --tlscacert=/certs/ca.pem
        - --tlscert=/certs/cert.pem
        - --tlskey=/certs/key.pem
        - debug
        - workers

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

      volumeMounts:
        - name: client-tls
          mountPath: /certs
          readOnly: true

  volumes:
    - name: client-tls
      secret:
        secretName: buildkit-client-tls
        defaultMode: 0440
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: jenkins-agents
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 1234
      targetPort: 1234
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: buildkitd-external
  namespace: jenkins-agents
  labels:
    kubernetes.io/service-name: buildkitd
    endpointslice.kubernetes.io/managed-by: local-configuration
addressType: IPv4
ports:
  - name: grpc
    protocol: TCP
    port: 1234
endpoints:
  - addresses: ["172.19.0.6"]
    conditions:
      ready: true
apiVersion: v1
kind: Service
metadata:
  name: jenkins-controller
  namespace: jenkins-agents
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080

---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jenkins-controller-external
  namespace: jenkins-agents
  labels:
    kubernetes.io/service-name: jenkins-controller
    endpointslice.kubernetes.io/managed-by: local-configuration
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 8080
endpoints:
  - addresses:
      - "172.19.0.5"
    conditions:
      ready: true
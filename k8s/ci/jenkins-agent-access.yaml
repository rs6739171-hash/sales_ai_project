apiVersion: v1
kind: Namespace
metadata:
  name: jenkins-agents
  labels:
    app.kubernetes.io/part-of: sales-ai
    environment: local
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-controller
  namespace: jenkins-agents
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: jenkins-agents
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agent-manager
  namespace: jenkins-agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs:
      - create
      - get

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources: ["events"]
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-controller-agent-manager
  namespace: jenkins-agents
subjects:
  - kind: ServiceAccount
    name: jenkins-controller
    namespace: jenkins-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-agent-manager
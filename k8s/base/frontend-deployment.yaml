apiVersion: apps/v1
kind: Deployment

metadata:
  name: sales-ai-frontend
  namespace: sales-ai

spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 300

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: sales-ai-frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sales-ai-frontend
        app.kubernetes.io/part-of: sales-ai

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300

      nodeSelector:
        salesiq.io/node-pool: applications

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sales-ai-frontend

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: sales_ai_frontend:local-v1
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
apiVersion: apps/v1
kind: Deployment

metadata:
  name: sales-ai-backend
  namespace: sales-ai

spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: sales-ai-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sales-ai-backend
        app.kubernetes.io/part-of: sales-ai

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300

      nodeSelector:
        salesiq.io/node-pool: applications

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sales-ai-backend

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: sales_ai_backend:local-v1
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - secretRef:
                name: sales-ai-backend-env
            - configMapRef:
                name: sales-ai-backend-config

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /openapi.json
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /openapi.json
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /openapi.json
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3